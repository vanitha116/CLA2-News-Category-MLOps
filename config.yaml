# News Category Classification MLOps Platform Configuration (Labs 1-13)

data:
  raw_path: data/raw/news_category.json
  new_data_path: data/raw/new_news_category.json
  archive_dir: data/raw/archive
  processed_dir: data/processed
  target_column: category
  text_column: combined_text
  id_column: link

split:
  test_size: 0.2
  random_state: 42

features:
  max_features: 25000
  ngram_range: [1, 2]
  sublinear_tf: true
  min_df: 2
  max_df: 0.95

model:
  C: 1.0
  random_state: 42
  class_weight: balanced

mlflow:
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: news_category_classification_mlops

registry:
  model_name: News_Category_Production_Model
  decision_metric: f1_score

quality_gate:
  metric: f1_score
  minimum_value: 0.45

lab9:
  repetitions: 3

paths:
  preprocessor: models/preprocessor.pkl
  model: models/news_model.pkl
  evaluation_report: reports/evaluation_report.json
  quality_gate_report: reports/quality_gate_report.json
  failure_report: reports/failure_report.json
  lifecycle_report: reports/lifecycle_report.json
  inference_output: outputs/inference_predictions.csv
  production_report: artifacts/production_model_report.json
