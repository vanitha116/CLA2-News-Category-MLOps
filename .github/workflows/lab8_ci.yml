name: Python CI & API Tests

on:
  push:
    branches: [ main, master ]
    paths:
      - 'config.yaml'
      - 'src/mlops_pipeline/**'
      - 'src/**'
      - 'api/**'
      - 'tests/**'
      - 'pipelines/**'
      - 'conftest.py'
      - 'pytest.ini'
      - 'requirements-api.txt'
      - 'requirements.txt'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python source
        run: |
          python -m compileall -q api src pipelines tests

      - name: Run tests
        run: |
          python -m pytest -q
